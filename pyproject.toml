[project]
name = "gro-store"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"

dependencies = [
    "django (>=5.2.7,<6.0.0)",
    "requests (>=2.32.3,<3.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "pillow (>=11.2.1,<12.0.0)",
    "redis (>=6.2.0,<7.0.0)",
    "djangorestframework (>=3.16.1,<4.0.0)",
    "django-filter (>=25.1,<26.0)",
    "drf-spectacular (>=0.28.0,<0.29.0)",
    "django-cors-headers (>=4.7.0,<5.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "environs (>=14.3.0,<15.0.0)",
    "ruff>=0.14.10",
    "orjson>=3.11.5",
    "uvicorn>=0.38.0",
]


[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py313"
exclude = [
    "src/tests/**",
    ".git",
    ".venv",
    "**/__pycache__/**",
    "**/migrations/*"
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "S",  # flake8-bandit
    "T20",# flake8-print
    "T10",# flake8-debugger
]
ignore = [
    "E501",  # line too long (если не хотите ограничивать длину строки)
    "S110",  # try-except-pass
]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"