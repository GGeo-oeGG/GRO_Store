[project]
name = "gro-store"
version = "0.1.0"
description = "online_store"
requires-python = ">=3.13"

dependencies = [
    "django (>=5.2.7,<6.0.0)",
    "requests (>=2.32.3,<3.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "pillow>=11.2.1,<12.0.0",
    "djangorestframework (>=3.16.1,<4.0.0)",
    "django-filter (>=25.1,<26.0)",
    "drf-spectacular (>=0.28.0,<0.29.0)",
    "django-cors-headers (>=4.7.0,<5.0.0)",
    "environs (>=14.3.0,<15.0.0)",
    "ruff>=0.14.10",
    "uvicorn>=0.38.0",
    "unidecode>=1.4.0",
    "django-imagekit>=6.1.0",
    "djangorestframework-simplejwt>=5.5.1",
]

[tool.ruff]
target-version = "py313"

line-length = 119

indent-width = 4

src = ["src"]

exclude = [
    "src/**/migrations/**",
    "src/**/tests/**",
    "src/**/fixtures/**",
    "src/**/__pycache__/**",
    ".venv",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C",
    "S",
    "D",
    "UP",
]

ignore = [
    "E501",
    "S101",
]

fixable = ["ALL"]

